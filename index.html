<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b1120">
    <title>Учёт продаж</title>
    <link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>

    <style>
        :root {
            --bg-main: #0b1120;
            --bg-card: #131c31;
            --bg-card-alt: #18233c;
            --bg-input: #0f172a;
            --border: #273552;
            --border-strong: #384b70;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --emerald: #10b981;
            --emerald-dark: #059669;
            --emerald-soft: rgba(16, 185, 129, 0.14);
            --pink-soft: rgba(236, 72, 153, 0.14);
            --amber-soft: rgba(245, 158, 11, 0.14);
            --blue-soft: rgba(59, 130, 246, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text);
            padding-bottom: 48px;
        }
        header {
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 20;
            padding: 12px 16px;
        }
        .header-inner {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .logo-block {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #10b981, #047857);
            color: #ffffff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
        .logo-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            line-height: 1.2;
            color: #f8fafc;
        }
        .logo-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin: 0;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-tool {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 11px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: var(--bg-card-alt);
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-tool:active {
            background: #233252;
        }
        .btn-tool.excel {
            background: rgba(16, 185, 129, 0.16);
            border-color: rgba(16, 185, 129, 0.45);
            color: #6ee7b7;
        }

        /* Вкладки навигации */
        .nav-tabs-wrap {
            max-width: 720px;
            margin: 14px auto 0;
            padding: 0 12px;
        }
        .nav-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: 13px;
        }
        .nav-tab-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .nav-tab-btn.active {
            background: var(--bg-card-alt);
            color: #ffffff;
            border: 1px solid var(--border-strong);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        main {
            max-width: 720px;
            margin: 14px auto 0;
            padding: 0 12px;
        }
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 14px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #f8fafc;
        }
        .dot-green {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            display: inline-block;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        .field-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        input[type="date"],
        input[type="number"],
        input[type="text"],
        input[type="month"],
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            background: var(--bg-input);
            font-size: 16px;
            color: #f8fafc;
            outline: none;
            font-family: inherit;
            color-scheme: dark;
        }
        input:focus, select:focus {
            border-color: var(--emerald);
            background: #111c33;
        }
        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        @media (max-width: 480px) {
            .platforms-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .platform-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 6px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--bg-input);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .platform-btn.active {
            border-color: #34d399;
            background: rgba(16, 185, 129, 0.16);
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.25);
            transform: scale(1.03);
        }
        .flags-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
            margin-bottom: 14px;
        }
        @media (max-width: 460px) {
            .flags-grid {
                grid-template-columns: 1fr;
            }
        }
        .flag-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
        }
        .fairy-box {
            background: rgba(236, 72, 153, 0.12);
            border: 1px solid rgba(244, 114, 182, 0.35);
        }
        .review-box {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.35);
        }
        .flag-box input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin: 0;
            cursor: pointer;
            flex-shrink: 0;
        }
        .fairy-box input[type="checkbox"] {
            accent-color: #ec4899;
        }
        .review-box input[type="checkbox"] {
            accent-color: #f59e0b;
        }
        .flag-text {
            font-size: 14px;
            font-weight: 700;
        }
        .fairy-text {
            color: #f9a8d4;
        }
        .review-text {
            color: #fcd34d;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.28);
        }
        .btn-submit:active {
            filter: brightness(0.95);
        }

        /* Контрастная карточка итогов за месяц с тонким сезонным акцентом */
        .month-summary-card {
            position: relative;
            overflow: hidden;
            transition: background 0.35s ease, border-color 0.35s ease;
        }
        .season-art {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 145px;
            height: 145px;
            pointer-events: none;
            z-index: 0;
        }
        .month-summary-content {
            position: relative;
            z-index: 1;
        }
        .summary-table-wrap {
            background: rgba(11, 17, 32, 0.78);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 12px;
            padding: 4px 8px;
            border: 1px solid rgba(148, 163, 184, 0.22);
        }

        .month-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }
        .month-nav {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-nav {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            background: var(--bg-input);
            color: #f1f5f9;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-nav:active {
            background: var(--bg-card-alt);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .col-plat {
            width: 24%;
        }
        .col-cnt {
            width: 32%;
        }
        .col-sum {
            width: 44%;
        }
        th {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 8px 4px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        th.num, td.num {
            text-align: right;
            white-space: nowrap;
        }
        td {
            padding: 9px 4px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.14);
            font-size: 14px;
            vertical-align: middle;
            color: #e2e8f0;
        }
        .row-total td {
            background: rgba(16, 185, 129, 0.18);
            color: #6ee7b7;
            font-weight: 800;
            font-size: 15px;
            border-top: 2px solid rgba(16, 185, 129, 0.45);
            border-bottom: 1px solid rgba(16, 185, 129, 0.35);
        }
        .row-fairy td {
            background: rgba(236, 72, 153, 0.14);
            color: #f9a8d4;
            font-weight: 700;
            font-size: 14px;
            border-bottom: 1px solid rgba(244, 114, 182, 0.25);
        }
        .row-review td {
            background: rgba(245, 158, 11, 0.14);
            color: #fcd34d;
            font-weight: 700;
            font-size: 14px;
            border-bottom: none;
        }
        .row-year-total td {
            background: rgba(59, 130, 246, 0.18);
            color: #93c5fd;
            font-weight: 800;
            font-size: 15px;
            border-top: 2px solid rgba(96, 165, 250, 0.45);
            border-bottom: 1px solid rgba(96, 165, 250, 0.35);
        }
        .total-label {
            line-height: 1.25;
            font-size: 13px;
        }
        .year-badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(96, 165, 250, 0.4);
            color: #93c5fd;
            font-size: 13px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
        }

        /* Диаграмма по всем месяцам */
        .chart-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .year-select {
            width: auto !important;
            padding: 7px 11px !important;
            font-size: 13px !important;
            font-weight: 700 !important;
        }
        .chart-canvas-wrap {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 10px 8px;
        }
        .chart-canvas-box {
            width: 100%;
            height: 235px;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .month-breakdown-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 4px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.14);
            font-size: 13px;
            cursor: pointer;
            border-radius: 8px;
        }
        .month-breakdown-row:last-child {
            border-bottom: none;
        }
        .month-breakdown-row:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .m-row-name {
            font-weight: 700;
            color: #f1f5f9;
            min-width: 88px;
        }
        .m-row-bar-wrap {
            flex: 1;
            height: 8px;
            background: #1e293b;
            border-radius: 999px;
            overflow: hidden;
            margin: 0 10px;
        }
        .m-row-bar {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #38bdf8);
            border-radius: 999px;
        }
        .m-row-stats {
            text-align: right;
            white-space: nowrap;
        }
        .m-row-sum {
            font-weight: 800;
            color: #6ee7b7;
        }
        .m-row-cnt {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: 5px;
        }

        .sale-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.14);
        }
        .sale-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .sale-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .sale-info {
            min-width: 0;
        }
        .sale-title {
            font-size: 14px;
            font-weight: 600;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sale-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .badge-fairy {
            background: rgba(236, 72, 153, 0.18);
            color: #f9a8d4;
            border: 1px solid rgba(244, 114, 182, 0.35);
            padding: 1px 7px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-review {
            background: rgba(245, 158, 11, 0.18);
            color: #fcd34d;
            border: 1px solid rgba(251, 191, 36, 0.35);
            padding: 1px 7px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .badge-review-off {
            background: var(--bg-input);
            color: #64748b;
            border: 1px dashed #334155;
            padding: 1px 7px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .sale-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .sale-amount {
            font-size: 15px;
            font-weight: 700;
            color: #f8fafc;
            white-space: nowrap;
        }
        .btn-del {
            background: none;
            border: none;
            color: #64748b;
            font-size: 18px;
            padding: 4px 6px;
            cursor: pointer;
        }
        .btn-del:hover {
            color: #f87171;
        }
        .empty-state {
            text-align: center;
            padding: 24px 10px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Модальное окно подтверждения удаления записи */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 60;
        }
        .modal-backdrop.open {
            display: flex;
        }
        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: 16px;
            padding: 18px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
        }
        .modal-title {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #f8fafc;
        }
        .modal-text {
            font-size: 13px;
            color: #cbd5e1;
            margin: 0 0 16px 0;
            line-height: 1.4;
        }
        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-modal-cancel {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            background: var(--bg-input);
            color: #e2e8f0;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-modal-confirm {
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #ef4444;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            border: 1px solid #475569;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            z-index: 50;
            display: none;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo-block">
            <div class="logo-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
            </div>
            <div>
                <h1 class="logo-title">Учёт продаж</h1>
                <p class="logo-sub">Автосохранение на устройстве</p>
            </div>
        </div>
        <div class="header-actions">
            <button type="button" class="btn-tool excel" onclick="exportCSV()">📥 Excel</button>
            <button type="button" class="btn-tool" onclick="exportJSON()">⬇️ Копия</button>
            <label class="btn-tool" style="margin:0;">
                ⬆️ Импорт
                <input type="file" accept=".json" style="display:none;" onchange="importJSON(event)">
            </label>
        </div>
    </div>
</header>

<div class="nav-tabs-wrap">
    <div class="nav-tabs">
        <button type="button" class="nav-tab-btn active" id="tabBtnSales" onclick="switchTab('sales')">📦 Продажи и итоги</button>
        <button type="button" class="nav-tab-btn" id="tabBtnMonths" onclick="switchTab('months')">📊 По месяцам</button>
    </div>
</div>

<main>
    <!-- ВКЛАДКА 1: ПРОДАЖИ И ИТОГИ -->
    <div id="panelSales" class="tab-panel active">
        <!-- Форма добавления продажи -->
        <section class="card">
            <h2 class="card-title"><span class="dot-green"></span> Новая продажа</h2>
            <form id="saleForm" onsubmit="addSale(event)">
                <div class="form-grid">
                    <div>
                        <label class="field-label" for="saleDate">Дата продажи</label>
                        <input type="date" id="saleDate" required>
                    </div>
                    <div>
                        <label class="field-label" for="saleAmount">Сумма продажи (₽)</label>
                        <input type="number" id="saleAmount" step="0.01" min="0" inputmode="decimal" placeholder="0" required>
                    </div>
                </div>

                <label class="field-label">Площадка</label>
                <div class="platforms-grid" id="platformButtons">
                    <!-- Авито 1 -->
                    <button type="button" class="platform-btn active" data-platform="Авито 1" onclick="selectPlatform('Авито 1')" aria-label="Авито 1">
                        <svg width="42" height="42" viewBox="0 0 40 40">
                            <rect width="40" height="40" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
                            <circle cx="15" cy="14" r="4.5" fill="#00AAFF"/>
                            <circle cx="24.5" cy="12" r="3" fill="#00E065"/>
                            <circle cx="13.5" cy="24" r="3.2" fill="#9747FF"/>
                            <circle cx="23.5" cy="23.5" r="5.2" fill="#FF4053"/>
                            <circle cx="31.5" cy="31.5" r="7" fill="#0f172a"/>
                            <text x="31.5" y="34.8" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800" font-family="sans-serif">1</text>
                        </svg>
                    </button>

                    <!-- Авито 2 -->
                    <button type="button" class="platform-btn" data-platform="Авито 2" onclick="selectPlatform('Авито 2')" aria-label="Авито 2">
                        <svg width="42" height="42" viewBox="0 0 40 40">
                            <rect width="40" height="40" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
                            <circle cx="15" cy="14" r="4.5" fill="#00AAFF"/>
                            <circle cx="24.5" cy="12" r="3" fill="#00E065"/>
                            <circle cx="13.5" cy="24" r="3.2" fill="#9747FF"/>
                            <circle cx="23.5" cy="23.5" r="5.2" fill="#FF4053"/>

        '08': { icon: '🌻', bg: 'linear-gradient(135deg, #131c31 0%, #2f2014 100%)', border: '#73451b', titleColor: '#fdba74', svg: '' },

        '12': { icon: '🎄', bg: 'linear-gradient(135deg, #131c31 0%, #112c24 100%)', border: '#1b5943', titleColor: '#6ee7b7', svg: '' }
    };

    function switchTab(tabName) {
        activeTab = tabName;
        document.getElementById('tabBtnSales').classList.toggle('active', tabName === 'sales');
        document.getElementById('tabBtnMonths').classList.toggle('active', tabName === 'months');
        document.getElementById('panelSales').classList.toggle('active', tabName === 'sales');
        document.getElementById('panelMonths').classList.toggle('active', tabName === 'months');

        if (tabName === 'months') {
            syncChartYearOptions();
            renderMonthsTab();
        }
    }

    function getSmallIcon(platform) {
        if (platform === 'Авито 1' || platform === 'Авито') {
            return '<svg width="30" height="30" viewBox="0 0 40 40" style="vertical-align:middle;"><rect width="40" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="15" cy="14" r="4.5" fill="#00AAFF"/><circle cx="24.5" cy="12" r="3" fill="#00E065"/><circle cx="13.5" cy="24" r="3.2" fill="#9747FF"/><circle cx="23.5" cy="23.5" r="5.2" fill="#FF4053"/><circle cx="31.5" cy="31.5" r="7" fill="#0f172a"/><text x="31.5" y="34.8" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800" font-family="sans-serif">1</text></svg>';
        }
        if (platform === 'Авито 2') {
            return '<svg width="30" height="30" viewBox="0 0 40 40" style="vertical-align:middle;"><rect width="40" height="40" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="15" cy="14" r="4.5" fill="#00AAFF"/><circle cx="24.5" cy="12" r="3" fill="#00E065"/><circle cx="13.5" cy="24" r="3.2" fill="#9747FF"/><circle cx="23.5" cy="23.5" r="5.2" fill="#FF4053"/><circle cx="31.5" cy="31.5" r="7" fill="#059669"/><text x="31.5" y="34.8" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800" font-family="sans-serif">2</text></svg>';
        }
        if (platform === 'WB' || platform === 'Вайлдберриз') {
            return '<svg width="30" height="30" viewBox="0 0 40 40" style="vertical-align:middle;"><rect width="40" height="40" rx="10" fill="#7c118f"/><text x="20" y="25.5" text-anchor="middle" fill="#ffffff" font-size="15.5" font-weight="900" font-family="sans-serif" letter-spacing="-0.5">WB</text></svg>';
        }
        if (platform === 'Вацап' || platform === 'Ватсап') {
            return '<svg width="30" height="30" viewBox="0 0 40 40" style="vertical-align:middle;"><rect width="40" height="40" rx="10" fill="#25D366"/><path d="M20 9.5c-5.8 0-10.5 4.7-10.5 10.5 0 1.9.5 3.7 1.4 5.3L9.5 30.5l5.4-1.4c1.5.8 3.3 1.3 5.1 1.3 5.8 0 10.5-4.7 10.5-10.5S25.8 9.5 20 9.5z" fill="#ffffff"/><path d="M25.4 23.2c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8.9-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5.1-.1.2-.3.4-.4.1-.1.2-.2.2-.4.1-.1 0-.3 0-.4-.1-.1-.5-1.3-.7-1.8-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.7.3-.2.2-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.8 2.7 4.3 3.8.6.3 1.1.4 1.4.5.6.2 1.2.2 1.6.1.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z" fill="#25D366"/></svg>';
        }
        if (platform === 'Телеграм') {
            return '<svg width="30" height="30" viewBox="0 0 40 40" style="vertical-align:middle;"><rect width="40" height="40" rx="10" fill="#2AABEE"/><path d="M28.5 12.2L10.3 19.2c-1.2.5-1.2 1.2-.2 1.5l4.7 1.5 10.8-6.8c.5-.3 1-.1.6.2l-8.8 7.9-.3 4.8c.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.5-1.4z" fill="#ffffff"/></svg>';
        }
        return '<svg width="30" height="30" viewBox="0 0 40 40" style="vertical-align:middle;"><rect width="40" height="40" rx="10" fill="#5b5ce6"/><path d="M20 9.5c-5.8 0-10.5 4.4-10.5 9.8 0 2.5 1 4.8 2.7 6.5-.2 1.6-.9 3.3-.9 3.3s2.1-.3 3.9-1.2c1.5.6 3.1.9 4.8.9 5.8 0 10.5-4.4 10.5-9.8S25.8 9.5 20 9.5z" fill="#ffffff" fill-opacity="0.22"/><text x="20" y="24" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="900" font-family="sans-serif">M</text></svg>';
    }

    function normalizePlatform(p) {
        if (p === 'Авито') return 'Авито 1';
        if (p === 'Вайлдберриз') return 'WB';
        if (p === 'Ватсап') return 'Вацап';
        if (p === 'Макс') return 'Мах';
        return p;
    }

    function selectPlatform(name) {
        selectedPlatform = name;
        var btns = document.querySelectorAll('.platform-btn');
        for (var i = 0; i < btns.length; i++) {
            if (btns[i].getAttribute('data-platform') === name) {
                btns[i].classList.add('active');
            } else {
                btns[i].classList.remove('active');
            }
        }
    }

    function showToast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(function() {
            el.style.display = 'none';
        }, 2400);
    }

    function loadSales() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch (e) {
            return [];
        }
    }

    function saveSales(data) {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
            showToast('Не удалось сохранить в память браузера');
        }
    }

    function formatMoney(val) {
        var num = Number(val) || 0;
        var parts = num.toFixed(num % 1 === 0 ? 0 : 2).split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        return parts.join(',') + ' ₽';
    }

    function formatDateRu(isoDate) {
        var p = isoDate.split('-');
        if (p.length !== 3) return isoDate;
        return p[2] + '.' + p[1] + '.' + p[0];
    }

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function applyMonthSeasonTheme(monthStr) {
        var mNum = monthStr.split('-')[1] || '01';
        var theme = MONTH_THEMES[mNum] || MONTH_THEMES['01'];
        var card = document.getElementById('monthSummaryCard');
        var art = document.getElementById('seasonArt');
        var title = document.getElementById('monthCardTitle');

        card.style.background = theme.bg;
        card.style.borderColor = theme.border;
        art.innerHTML = theme.svg;
        title.style.color = theme.titleColor;
        title.innerHTML = theme.icon + ' Итоги за месяц';
    }

    function addSale(e) {
        e.preventDefault();
        var dateVal = document.getElementById('saleDate').value;
        var amountVal = parseFloat(document.getElementById('saleAmount').value);
        var productVal = document.getElementById('saleProduct').value.trim();
        var fairyVal = document.getElementById('saleFairy').checked;
        var reviewVal = document.getElementById('saleReview').checked;

        if (!dateVal || isNaN(amountVal) || !productVal) return;

        var sales = loadSales();
        sales.unshift({
            id: Date.now(),
            sale_date: dateVal,
            product: productVal,
            platform: selectedPlatform,
            amount: amountVal,
            from_fairy: fairyVal,
            has_review: reviewVal
        });
        saveSales(sales);

        document.getElementById('saleProduct').value = '';
        document.getElementById('saleAmount').value = '';
        document.getElementById('saleFairy').checked = false;
        document.getElementById('saleReview').checked = false;
        document.getElementById('monthPicker').value = dateVal.slice(0, 7);

        renderAll();
        showToast('Продажа добавлена');
    }

    function toggleReview(id) {
        var sales = loadSales();
        for (var i = 0; i < sales.length; i++) {
            if (sales[i].id === id) {
                sales[i].has_review = !sales[i].has_review;
                break;
            }
        }
        saveSales(sales);
        renderAll();
    }

    function openDeleteModal(id) {
        var sales = loadSales();
        var target = null;
        for (var i = 0; i < sales.length; i++) {
            if (sales[i].id === id) {
                target = sales[i];
                break;
            }
        }
        if (!target) return;
        pendingDeleteId = id;
        document.getElementById('deleteModalText').textContent =
            'Удалить «' + target.product + '» на сумму ' + formatMoney(target.amount) + '?';
        document.getElementById('deleteModal').classList.add('open');
    }

    function closeDeleteModal() {
        pendingDeleteId = null;
        document.getElementById('deleteModal').classList.remove('open');
    }

    function confirmDeleteSale() {
        if (pendingDeleteId === null) return;
        var sales = loadSales().filter(function(item) {
            return item.id !== pendingDeleteId;
        });
        saveSales(sales);
        closeDeleteModal();
        renderAll();
        showToast('Запись удалена');
    }

    function changeMonth(delta) {
        var picker = document.getElementById('monthPicker');
        var parts = picker.value.split('-');
        var y = parseInt(parts[0], 10);
        var m = parseInt(parts[1], 10) - 1 + delta;
        var d = new Date(y, m, 1);
        var ny = d.getFullYear();
        var nm = String(d.getMonth() + 1).padStart(2, '0');
        picker.value = ny + '-' + nm;
        renderAll();
    }

    function syncChartYearOptions() {
        var allSales = loadSales();
        var selectedMonth = document.getElementById('monthPicker').value;
        var currentYear = selectedMonth ? selectedMonth.slice(0, 4) : String(new Date().getFullYear());
        var yearsSet = {};
        yearsSet[currentYear] = true;
        yearsSet[String(new Date().getFullYear())] = true;

        allSales.forEach(function(s) {
            if (s.sale_date && s.sale_date.length >= 4) {
                yearsSet[s.sale_date.slice(0, 4)] = true;
            }
        });

        var years = Object.keys(yearsSet).sort().reverse();
        var sel = document.getElementById('chartYearSelect');
        var prevVal = sel.value || currentYear;
        sel.innerHTML = years.map(function(y) {
            return '<option value="' + y + '">' + y + ' год</option>';
        }).join('');
        sel.value = yearsSet[prevVal] ? prevVal : currentYear;
    }

    function renderMonthsTab() {
        var allSales = loadSales();
        var sel = document.getElementById('chartYearSelect');
        var year = sel.value || document.getElementById('monthPicker').value.slice(0, 4);

        var monthlySums = new Array(12).fill(0);
        var monthlyCounts = new Array(12).fill(0);

        allSales.forEach(function(item) {
            if (!item.sale_date || item.sale_date.slice(0, 4) !== year) return;
            var mIdx = parseInt(item.sale_date.slice(5, 7), 10) - 1;
            if (mIdx >= 0 && mIdx < 12) {
                monthlySums[mIdx] += Number(item.amount) || 0;
                monthlyCounts[mIdx] += 1;
            }
        });

        drawMonthsChart(monthlySums);

        var maxSum = Math.max.apply(null, monthlySums);
        var listHtml = '';
        for (var i = 0; i < 12; i++) {
            var mmStr = String(i + 1).padStart(2, '0');
            var ym = year + '-' + mmStr;
            var pct = maxSum > 0 ? Math.round((monthlySums[i] / maxSum) * 100) : 0;

            listHtml += '<div class="month-breakdown-row" onclick="jumpToMonth(\'' + ym + '\')" title="Открыть этот месяц">' +
                '<span class="m-row-name">' + MONTH_NAMES_FULL[i] + '</span>' +
                '<div class="m-row-bar-wrap"><div class="m-row-bar" style="width:' + pct + '%"></div></div>' +
                '<span class="m-row-stats"><span class="m-row-sum">' + formatMoney(monthlySums[i]) + '</span><span class="m-row-cnt">' + monthlyCounts[i] + ' шт.</span></span>' +
                '</div>';
        }
        document.getElementById('monthsBreakdownList').innerHTML = listHtml;
    }

    function jumpToMonth(ym) {
        document.getElementById('monthPicker').value = ym;
        renderAll();
        switchTab('sales');
    }

    function drawMonthsChart(monthlySums) {
        var canvas = document.getElementById('monthsChart');
        if (!canvas) return;
        var rect = canvas.parentElement.getBoundingClientRect();
        if (rect.width === 0) return;

        var dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        var ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        var W = rect.width;
        var H = rect.height;
        ctx.clearRect(0, 0, W, H);

        var padL = 10, padR = 10, padT = 24, padB = 26;
        var plotW = W - padL - padR;
        var plotH = H - padT - padB;
        var maxVal = Math.max.apply(null, monthlySums);

        // Горизонтальные линии сетки
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.14)';
        ctx.lineWidth = 1;
        for (var g = 0; g <= 3; g++) {
            var gy = padT + (plotH / 3) * g;
            ctx.beginPath();
            ctx.moveTo(padL, gy);
            ctx.lineTo(W - padR, gy);
            ctx.stroke();
        }

        var slotW = plotW / 12;
        var barW = Math.min(26, Math.max(10, slotW * 0.58));

        for (var i = 0; i < 12; i++) {
            var val = monthlySums[i];
            var barH = maxVal > 0 ? Math.max(val > 0 ? 6 : 2, (val / maxVal) * plotH) : 2;
            var x = padL + i * slotW + (slotW - barW) / 2;
            var y = padT + plotH - barH;

            if (val > 0) {
                var grad = ctx.createLinearGradient(0, y, 0, padT + plotH);
                grad.addColorStop(0, '#34d399');
                grad.addColorStop(1, '#059669');
                ctx.fillStyle = grad;
            } else {
                ctx.fillStyle = '#1e293b';
            }

            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(x, y, barW, barH, [6, 6, 2, 2]);
            } else {
                ctx.rect(x, y, barW, barH);
            }
            ctx.fill();

            if (val > 0) {
                ctx.fillStyle = '#e2e8f0';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                var shortSum = val >= 1000 ? Math.round(val / 1000) + 'к' : String(Math.round(val));
                ctx.fillText(shortSum, x + barW / 2, y - 5);
            }

            ctx.fillStyle = '#94a3b8';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(MONTH_NAMES_SHORT[i], x + barW / 2, H - 8);
        }
    }

    function renderAll() {
        var selectedMonth = document.getElementById('monthPicker').value;
        var selectedYear = selectedMonth.slice(0, 4);

        applyMonthSeasonTheme(selectedMonth);

        var allSales = loadSales();

        var monthSales = allSales.filter(function(item) {
            return item.sale_date && item.sale_date.indexOf(selectedMonth) === 0;
        });

        monthSales.sort(function(a, b) {
            if (b.sale_date !== a.sale_date) return b.sale_date.localeCompare(a.sale_date);
            return b.id - a.id;
        });

        var summaryHtml = '';
        var grandCount = 0;
        var grandTotal = 0;
        var fairyCount = 0;
        var fairyTotal = 0;
        var reviewCount = 0;

        for (var i = 0; i < PLATFORMS.length; i++) {
            var plat = PLATFORMS[i];
            var pCount = 0;
            var pTotal = 0;

            for (var j = 0; j < monthSales.length; j++) {
                if (normalizePlatform(monthSales[j].platform) === plat) {
                    pCount++;
                    pTotal += Number(monthSales[j].amount) || 0;
                }
            }

            grandCount += pCount;
            grandTotal += pTotal;

            summaryHtml += '<tr>' +
                '<td>' + getSmallIcon(plat) + '</td>' +
                '<td class="num">' + pCount + ' шт.</td>' +
                '<td class="num" style="font-weight:700;">' + formatMoney(pTotal) + '</td>' +
                '</tr>';
        }

        for (var k = 0; k < monthSales.length; k++) {
            var amt = Number(monthSales[k].amount) || 0;
            if (monthSales[k].from_fairy) {
                fairyCount++;
                fairyTotal += amt;
            }
            if (monthSales[k].has_review) {
                reviewCount++;
            }
        }

        summaryHtml += '<tr class="row-total">' +
            '<td class="total-label">ИТОГО<br>ЗА МЕСЯЦ</td>' +
            '<td class="num">' + grandCount + ' шт.</td>' +
            '<td class="num">' + formatMoney(grandTotal) + '</td>' +
            '</tr>';

        summaryHtml += '<tr class="row-fairy">' +
            '<td class="total-label">🧚 в том числе<br>от феи</td>' +
            '<td class="num">' + fairyCount + ' шт.</td>' +
            '<td class="num">' + formatMoney(fairyTotal) + '</td>' +
            '</tr>';

        summaryHtml += '<tr class="row-review">' +
            '<td class="total-label">⭐ Отзывы</td>' +
            '<td class="num">' + reviewCount + ' шт.</td>' +
            '<td class="num"></td>' +
            '</tr>';

        document.getElementById('summaryBody').innerHTML = summaryHtml;

        document.getElementById('yearBadge').textContent = selectedYear + ' год';
        var yearSales = allSales.filter(function(item) {
            return item.sale_date && item.sale_date.indexOf(selectedYear) === 0;
        });

        var yearTotalCount = yearSales.length;
        var yearTotalSum = 0;
        var yearFairyCount = 0;
        var yearFairySum = 0;
        var yearReviewCount = 0;

        for (var y = 0; y < yearSales.length; y++) {
            var yAmt = Number(yearSales[y].amount) || 0;
            yearTotalSum += yAmt;
            if (yearSales[y].from_fairy) {
                yearFairyCount++;
                yearFairySum += yAmt;
            }
            if (yearSales[y].has_review) {
                yearReviewCount++;
            }
        }

        var yearHtml = '';
        yearHtml += '<tr class="row-year-total">' +
            '<td class="total-label">ИТОГО<br>ЗА ГОД</td>' +
            '<td class="num">' + yearTotalCount + ' шт.</td>' +
            '<td class="num">' + formatMoney(yearTotalSum) + '</td>' +
            '</tr>';

        yearHtml += '<tr class="row-fairy">' +
            '<td class="total-label">🧚 в том числе<br>от феи</td>' +
            '<td class="num">' + yearFairyCount + ' шт.</td>' +
            '<td class="num">' + formatMoney(yearFairySum) + '</td>' +
            '</tr>';

        yearHtml += '<tr class="row-review">' +
            '<td class="total-label">⭐ Отзывы</td>' +
            '<td class="num">' + yearReviewCount + ' шт.</td>' +
            '<td class="num"></td>' +
            '</tr>';

        document.getElementById('yearSummaryBody').innerHTML = yearHtml;

        document.getElementById('salesCountBadge').textContent = monthSales.length + ' шт.';
        var listEl = document.getElementById('salesList');

        if (monthSales.length === 0) {
            listEl.innerHTML = '<div class="empty-state">За этот месяц продаж пока нет</div>';
        } else {
            var listHtml = '';
            for (var m = 0; m < monthSales.length; m++) {
                var s = monthSales[m];
                var fairyBadge = s.from_fairy ? '<span class="badge-fairy">🧚 От феи</span>' : '';
                var reviewBadge = s.has_review
                    ? '<span class="badge-review" onclick="toggleReview(' + s.id + ')" title="Нажмите, чтобы снять отметку">⭐ Отзыв</span>'
                    : '<span class="badge-review-off" onclick="toggleReview(' + s.id + ')" title="Нажмите, чтобы отметить отзыв">☆ Отзыв</span>';

                listHtml += '<div class="sale-item">' +
                    '<div class="sale-left">' +
                        getSmallIcon(s.platform) +
                        '<div class="sale-info">' +
                            '<div class="sale-title">' + escapeHtml(s.product) + '</div>' +
                            '<div class="sale-meta">' +
                                '<span>' + formatDateRu(s.sale_date) + '</span>' +
                                fairyBadge +
                                reviewBadge +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="sale-right">' +
                        '<span class="sale-amount">' + formatMoney(s.amount) + '</span>' +
                        '<button type="button" class="btn-del" onclick="openDeleteModal(' + s.id + ')" title="Удалить">✕</button>' +
                    '</div>' +
                '</div>';
            }
            listEl.innerHTML = listHtml;
        }

        if (activeTab === 'months') {
            syncChartYearOptions();
            renderMonthsTab();
        }
    }

    function exportCSV() {
        var selectedMonth = document.getElementById('monthPicker').value;
        var sales = loadSales().filter(function(item) {
            return item.sale_date && item.sale_date.indexOf(selectedMonth) === 0;
        });

        if (sales.length === 0) {
            showToast('За этот месяц нет данных');
            return;
        }

        var lines = ['Дата;Товар;Площадка;От феи;Отзыв;Сумма'];
        for (var i = 0; i < sales.length; i++) {
            var s = sales[i];
            var prod = '"' + String(s.product).replace(/"/g, '""') + '"';
            var amt = String(s.amount).replace('.', ',');
            lines.push([
                s.sale_date,
                prod,
                normalizePlatform(s.platform),
                s.from_fairy ? 'Да' : 'Нет',
                s.has_review ? 'Да' : 'Нет',
                amt
            ].join(';'));
        }

        var blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'sales_' + selectedMonth + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function exportJSON() {
        var sales = loadSales();
        var blob = new Blob([JSON.stringify(sales, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'sales_backup_' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Резервная копия скачана');
    }

    function importJSON(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(evt) {
            try {
                var parsed = JSON.parse(evt.target.result);
                if (!Array.isArray(parsed)) throw new Error('bad format');
                var cleaned = parsed.map(function(item, idx) {
                    return {
                        id: item.id || (Date.now() + idx),
                        sale_date: item.sale_date || item.date,
                        product: item.product,
                        platform: normalizePlatform(item.platform),
                        amount: Number(item.amount) || 0,
                        from_fairy: Boolean(item.from_fairy !== undefined ? item.from_fairy : item.fromFairy),
                        has_review: Boolean(item.has_review !== undefined ? item.has_review : item.isReview)
                    };
                });
                saveSales(cleaned);
                if (cleaned.length > 0 && cleaned[0].sale_date) {
                    document.getElementById('monthPicker').value = cleaned[0].sale_date.slice(0, 7);
                }
                renderAll();
                showToast('Загружено записей: ' + cleaned.length);
            } catch (err) {
                showToast('Ошибка: неверный файл копии');
            }
            e.target.value = '';
        };
        reader.readAsText(file);
    }

    window.addEventListener('resize', function() {
        if (activeTab === 'months') {
            renderMonthsTab();
        }
    });

    (function init() {
        var now = new Date();
        var yyyy = now.getFullYear();
        var mm = String(now.getMonth() + 1).padStart(2, '0');
        var dd = String(now.getDate()).padStart(2, '0');
        var today = yyyy + '-' + mm + '-' + dd;

        document.getElementById('saleDate').value = today;
        document.getElementById('monthPicker').value = yyyy + '-' + mm;
        syncChartYearOptions();
        renderAll();
    })();
</script>
